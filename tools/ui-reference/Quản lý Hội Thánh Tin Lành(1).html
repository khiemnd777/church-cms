<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quản lý Hội Thánh Tin Lành</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,600;0,700;1,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: sidebar điều hướng cố định bên trái + vùng làm việc; điện thoại: sidebar thành ngăn kéo */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#EBF0EF; --line:#DAE2E0;
  --fg:#14222A; --muted:#5A6A6F; --faint:#8A989B;
  --primary:#0E5A5F; --primary-ink:#FFFFFF; --primary-soft:#DCEDEC;
  --gold:#A86C12; --gold-soft:#F6EAD2; --friend:#6E4BA6; --friend-soft:#EDE6F7;
  --good:#2C7A4B; --good-soft:#DFF0E5; --warn:#A6530A; --warn-soft:#FBEAD4; --bad:#B0252F; --bad-soft:#F8E0E2;
  --hero:#0F2E33; --hero-2:#163F45; --hero-fg:#F1F6F5; --hero-muted:#A6C1BF; --hero-line:rgba(255,255,255,.14);
  --shadow:0 1px 2px rgba(20,34,42,.05),0 6px 20px rgba(20,34,42,.05);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Lora",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1416; --surface:#142023; --surface-2:#1A2A2E; --line:#26393E;
  --fg:#E4ECEA; --muted:#97A9AB; --faint:#6E8285;
  --primary:#5BB8B3; --primary-ink:#06201F; --primary-soft:#183A3B;
  --gold:#E2AA4E; --gold-soft:#382B15; --friend:#BFA6EA; --friend-soft:#2C2340; --good:#6FC28D; --good-soft:#173322; --warn:#E9A45A; --warn-soft:#3A2915; --bad:#F27F87; --bad-soft:#3D1C20;
  --hero:#0A2125; --hero-2:#11343A; --hero-fg:#EEF5F4; --hero-muted:#93B3B1; --hero-line:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1416; --surface:#142023; --surface-2:#1A2A2E; --line:#26393E;
  --fg:#E4ECEA; --muted:#97A9AB; --faint:#6E8285;
  --primary:#5BB8B3; --primary-ink:#06201F; --primary-soft:#183A3B;
  --gold:#E2AA4E; --gold-soft:#382B15; --friend:#BFA6EA; --friend-soft:#2C2340; --good:#6FC28D; --good-soft:#173322; --warn:#E9A45A; --warn-soft:#3A2915; --bad:#F27F87; --bad-soft:#3D1C20;
  --hero:#0A2125; --hero-2:#11343A; --hero-fg:#EEF5F4; --hero-muted:#93B3B1; --hero-line:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 14px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.logo svg{width:22px;height:22px;stroke-width:2.6}
.brand small{display:block;font-size:11px;letter-spacing:.12em;color:var(--primary);font-weight:700}
.brand b{font-size:16px;font-weight:700}
.side-note{margin:0 16px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.side-note .ver{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;letter-spacing:.06em}
nav{padding:6px 12px 16px;display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--faint);padding:14px 10px 6px}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav-a:hover{background:var(--surface-2);color:var(--fg)}
.nav-a.on{background:var(--primary);color:var(--primary-ink)}
.nav-a .cnt{margin-left:auto;font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:1px 7px;font-weight:600}
.nav-a.on .cnt{background:rgba(255,255,255,.2);color:inherit}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;font-size:12px;color:var(--muted)}
.side-foot b{color:var(--fg);font-size:13px}
.role-sel{margin-top:8px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:16px;margin:0;font-weight:700}
.top .sub{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.top .sp{flex:1}
.demo-tag{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:20px;padding:5px 11px;white-space:nowrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px}
.content{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1360px;width:100%}

/* Common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h p{margin:0;font-size:12px;color:var(--muted);flex-basis:100%}
.card-h .link{margin-left:auto}
.link{border:0;background:none;color:var(--primary);font-weight:600;font-size:13px;padding:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-pri{background:var(--primary-soft);color:var(--primary)}
.p-gold{background:var(--gold-soft);color:var(--gold)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.sm{padding:5px 10px;font-size:12px}
.input,.select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input{flex:1 1 220px}
.muted{color:var(--muted)}
.small{font-size:12px}
h2.page{font-size:20px;margin:0;font-weight:700}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.page-h .sp{flex:1}

/* Hero */
.hero{background:linear-gradient(135deg,var(--hero),var(--hero-2));color:var(--hero-fg);border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:220px;height:300px;opacity:.06;background:
 linear-gradient(var(--hero-fg),var(--hero-fg)) center/22px 100% no-repeat,
 linear-gradient(var(--hero-fg),var(--hero-fg)) center 32%/150px 22px no-repeat;pointer-events:none}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--hero-muted)}
.eyebrow span:first-child{background:rgba(255,255,255,.1);border-radius:20px;padding:3px 10px;color:var(--hero-fg)}
.hero h2{font-family:var(--f-display);font-size:32px;margin:12px 0 6px;letter-spacing:.01em;text-wrap:balance}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--hero-muted)}
.hero .meta b{color:var(--hero-fg);font-weight:600}
.staff{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.staff div{border:1px solid var(--hero-line);border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.04)}
.staff small{display:block;font-size:10px;letter-spacing:.1em;color:var(--hero-muted);font-weight:700}
.staff b{font-size:13px}
.hero-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;z-index:1}
.hero-r small{font-size:11px;letter-spacing:.12em;color:var(--hero-muted);font-weight:700}
.hero-r .d{font-family:var(--f-display);font-size:21px;font-style:italic}
.next-sun{border:1px solid var(--hero-line);border-radius:10px;padding:9px 12px;text-align:left;font-size:12px;color:var(--hero-muted);max-width:280px}
.next-sun b{color:var(--hero-fg)}
.btn.hero-btn{background:var(--hero-fg);color:var(--hero);border-color:transparent}

/* KPI */
.kpi .lbl{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.kpi .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.15;margin:6px 0 2px}
.kpi .foot{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.kpi .foot b{color:var(--fg)}
.delta-up{color:var(--good);font-weight:600}
.delta-dn{color:var(--bad);font-weight:600}

/* Quick actions */
.qa{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.qa button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:12px;text-align:center}
.qa button:hover{border-color:var(--primary);color:var(--primary)}
.qa svg.i{width:22px;height:22px;color:var(--primary)}

/* Bars */
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:13px}
.hbar .track{grid-column:1/-1;height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--primary);border-radius:5px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13px}
.li .t span{font-size:12px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--primary-soft);color:var(--primary)}
.av.f{background:var(--gold-soft);color:var(--gold)}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface-2);font-weight:700;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td .nm{font-weight:600}
td.nm.num,td.right.num,td.num.muted{white-space:nowrap}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--line);display:block}
.dots i.on{background:var(--good)}
.right{text-align:right}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--primary);border-color:var(--primary)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,22,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:31;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);z-index:31;border-radius:16px;padding:22px}
.x{border:0;background:var(--surface-2);border-radius:8px;padding:6px;margin-left:auto}
.dsec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.dsec h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv span{color:var(--muted)}
.locked{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.idcard{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px;background:linear-gradient(135deg,var(--hero),var(--hero-2));color:var(--hero-fg)}
.idcard .qr{background:#fff;padding:6px;border-radius:8px;width:96px;height:96px;flex:none}
.idcard .qr img,.idcard .qr canvas{width:84px!important;height:84px!important}
.idcard small{color:var(--hero-muted);font-size:11px;letter-spacing:.08em;display:block}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}

/* Certificate */
.cert{border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:4px;border-radius:6px;padding:28px 24px;text-align:center;background:var(--surface);margin:8px}
.cert .org{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.cert h3{font-family:var(--f-display);font-size:26px;color:var(--gold);margin:14px 0 4px}
.cert .who{font-family:var(--f-display);font-size:22px;font-style:italic;margin:14px 0}
.cert .sig{display:flex;justify-content:space-around;margin-top:26px;font-size:12px;color:var(--muted);gap:12px}
.cert .sig b{display:block;color:var(--fg);margin-top:34px}

/* Attendance */
.att-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.att-count{font-family:var(--f-display);font-size:30px;font-weight:700}
.att-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.att-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);text-align:left}
.att-item.on{border-color:var(--good);background:var(--good-soft)}
.att-item .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.att-item.on .chk{background:var(--good);border-color:var(--good);color:#fff}
.att-item .t{min-width:0;flex:1}
.att-item b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-item span{font-size:11px;color:var(--muted)}
.flash{animation:fl 1s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--good)}100%{box-shadow:0 0 0 0 transparent}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;font-size:13px;max-width:calc(100% - 32px)}
.ban-card .lead{font-size:12px;color:var(--muted)}
.ban-card .n{font-family:var(--f-display);font-size:26px;font-weight:700}
.feature{display:flex;gap:12px}
.feature .ic{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.feature b{display:block;font-size:13px;margin-bottom:2px}
.feature p{margin:0;font-size:12px;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted)}

.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .step{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2);font-size:12px;color:var(--muted);min-width:0}
.flow .step b{display:block;color:var(--fg);font-size:13px}
.flow .arr{color:var(--faint)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--surface);font-weight:500;cursor:pointer}
.form .opt{flex-direction:row;font-size:13px;color:var(--fg)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.opt:has(input:disabled){cursor:not-allowed;opacity:.75}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;background:var(--surface-2);font-weight:500}
.tag small{color:var(--muted)}
.tag button{border:0;background:none;padding:2px;border-radius:50%;color:var(--muted);display:grid}
.tag button svg.i{width:14px;height:14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow .input{flex:1 1 200px}
.fund-row{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.fund-row:first-child{border-top:0}
.fund-row .input{flex:1;min-width:0}
.sub-h{font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--muted);margin:4px 0 -6px}
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
textarea.input{resize:vertical;min-height:70px}
.p-friend{background:var(--friend-soft);color:var(--friend)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini>div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.mini b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.2}
.mini span{font-size:12px;color:var(--muted)}
.stagebar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:16px 0 8px;gap:2px;background:var(--surface-2)}
.stagebar i{display:block;background:var(--friend)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-bottom:6px}

<script>
(function(){
/* ============ Tiện ích ============ */
let seed=20261021;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const pick=a=>a[Math.floor(rnd()*a.length)];
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();

const D=(y,m,d)=>new Date(y,m-1,d);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const tr=n=>(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['Chúa nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const TODAY=D(2026,10,21);
const LAST_SUN=addD(TODAY,-TODAY.getDay());   // 18/10/2026
const NEXT_SUN=addD(LAST_SUN,7);               // 25/10/2026
const SUNDAYS=[];for(let i=11;i>=0;i--)SUNDAYS.push(addD(LAST_SUN,-7*i));
const WEEK_START=addD(TODAY,-TODAY.getDay()),WEEK_END=addD(WEEK_START,6);
const bdThisYear=m=>new Date(2026,m.dob.getMonth(),m.dob.getDate());
const turnAge=m=>2026-m.dob.getFullYear();

const inWeek=m=>{const t=bdThisYear(m);return turnAge(m)>=1&&t>=WEEK_START&&t<=WEEK_END};
const MONTH_VI=m=>'Tháng '+(m+1);

const P={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

 house:'<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/>',

 check:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 drop:'<path d="M12 2.7S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.3-6-11.3z"/>',

 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',

 scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',

 stamp:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',

};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;

/* ============ Dữ liệu mẫu ============ */
const HO=['Nguyễn','Trần','Lê','Phạm','Hoàng','Huỳnh','Phan','Võ','Đặng','Bùi','Đỗ','Hồ','Ngô','Dương','Lý','Mai','Đinh','Trương'];
const DEM={Nam:['Văn','Minh','Hữu','Đức','Quốc','Thanh','Công','Gia','Đình','Ngọc'],Nữ:['Thị','Ngọc','Thu','Kim','Bảo','Mỹ','Thanh','Hoài','Phương','Diệu']};
const TEN={Nam:['Ân','Phúc','Thiện','Vinh','Khang','Hiếu','Nhân','Tín','Trung','Hòa','Bình','Lộc','Phước','Sang','Tâm','Hưng','Quang','Đạt','Khải','Thành','Nghĩa','Huy'],
 Nữ:['Ân','Hồng','Hạnh','Lan','Mai','Ngọc','Thảo','Hiền','Nhung','Trang','Hoa','Yến','Linh','Phương','Vy','Diễm','Hà','Thùy','Hân','Uyên','Giang','Nhi']};
/* Cấu hình do Mục sư Quản nhiệm thiết lập */
const cfg={unitType:'Khu vực',unitCustom:'',banMode:'auto',
  serviceBans:['Ban Hát Thánh ca','Ban Thăm viếng','Ban Truyền giảng','Giáo viên Trường Chúa nhật'],
  proposers:new Set(['tk','tq','tb']),approver:'ms'};
const U=()=>cfg.unitType==='Khác'?(cfg.unitCustom.trim()||'Đơn vị'):cfg.unitType;
const Ul=()=>U().toLowerCase();
const GROUPS=[
 {id:'g1',name:'Bình Minh',day:'Tối thứ Sáu',lead:''},
 {id:'g2',name:'Hy Vọng',day:'Tối thứ Năm',lead:''},
 {id:'g3',name:'Ân Điển',day:'Tối thứ Sáu',lead:''},
 {id:'g4',name:'Sự Sáng',day:'Tối thứ Ba',lead:''},
 {id:'g5',name:'Phước Hạnh',day:'Chiều thứ Bảy',lead:''},
 {id:'g6',name:'Bình An',day:'Tối thứ Năm',lead:''}];
const gName=id=>{const g=GROUPS.find(g=>g.id===id);return g?U()+' '+g.name:''};
const AGE_BANS=[['Ban Thiếu nhi',4,11],['Ban Thiếu niên',12,17],['Ban Thanh niên',18,35],['Ban Trung niên',36,59],['Ban Cao niên',60,120]];
const BAN_INFO={'Ban Chấp sự':'Họp tối thứ Hai đầu tháng','Ban Thiếu nhi':'Trường Chúa nhật 9:00','Ban Thiếu niên':'Chiều thứ Bảy 16:00','Ban Thanh niên':'Tối thứ Bảy 19:00','Ban Trung niên':'Chiều Chúa nhật thứ 2 & 4','Ban Cao niên':'Sáng thứ Năm 8:00','Ban Hát Thánh ca':'Tập tối thứ Sáu','Ban Thăm viếng':'Theo lịch phân công','Ban Truyền giảng':'Chiều thứ Bảy','Giáo viên Trường Chúa nhật':'Soạn bài tối thứ Năm'};
const allBanNames=()=>['Ban Chấp sự',...AGE_BANS.map(b=>b[0]),...cfg.serviceBans];
const ageBansFor=a=>AGE_BANS.filter(x=>a>=x[1]&&a<=x[2]).map(x=>x[0]);

const members=[],families=[];let mid=1;
function person(ho,g,age,role,fam,opts={}){
  const by=2026-age;let dob=D(by,ri(1,12),ri(1,28));
  if(dob>TODAY)dob=D(by-1,dob.getMonth()+1,dob.getDate());
  const m={id:'TH-'+String(mid++).padStart(4,'0'),ho,dem:pick(DEM[g]),ten:pick(TEN[g]),g,dob,role,fam:fam.id,group:fam.group,
    phone:age>=16?'09'+ri(0,9)+' '+ri(100,999)+' '+ri(100,999):'',bans:[],notes:[]};
  m.name=m.ho+' '+m.dem+' '+m.ten;m.type='Tín hữu';
  m.age=ageOf(dob);
  if(m.age<13){m.status='Thiếu nhi';
    if(rnd()<.8){m.dedication=D(by+(dob.getMonth()>9?1:0),Math.min(12,dob.getMonth()+ri(2,5)),ri(1,28));if(m.dedication>TODAY)m.dedication=null}}
  else if(rnd()<.86){m.status='Thành viên';const y=Math.max(by+13,1978);m.baptism=D(Math.min(2025,y+ri(0,Math.max(0,2025-y))),ri(1,12),ri(1,28))}
  else m.status='Dự bị';
  const r=rnd();m.active=opts.active||(m.age>=18&&r<.025?'Chuyển đi':r<.085?'Vắng lâu':'Đang sinh hoạt');
  const p=ri(55,97)/100;
  m.att=SUNDAYS.map((s,i)=>m.active==='Chuyển đi'?false:m.active==='Vắng lâu'?(i<6&&rnd()<.4):rnd()<p);
  for(const[b,a1,a2]of AGE_BANS)if(m.age>=a1&&m.age<=a2&&m.active!=='Chuyển đi')m.bans.push(b);
  if(m.age>=16&&m.active==='Đang sinh hoạt'){
    if(rnd()<.12)m.bans.push('Ban Hát Thánh ca');
    if(m.age>30&&rnd()<.07)m.bans.push('Ban Thăm viếng');
    if(m.age>18&&rnd()<.05)m.bans.push('Ban Truyền giảng');
    if(m.age>=18&&m.age<=55&&m.status==='Thành viên'&&rnd()<.06)m.bans.push('Giáo viên Trường Chúa nhật');
  }
  members.push(m);fam.members.push(m.id);return m;
}
function ageOf(d){let a=TODAY.getFullYear()-d.getFullYear();if(TODAY.getMonth()<d.getMonth()||(TODAY.getMonth()===d.getMonth()&&TODAY.getDate()<d.getDate()))a--;return a}
for(let f=0;f<112;f++){
  const grp=GROUPS[Math.floor(rnd()*6)].id;
  const fam={id:'GĐ-'+String(f+1).padStart(3,'0'),group:grp,members:[],since:ri(1975,2025)};
  families.push(fam);
  const ha=ri(25,82),hg=rnd()<.8?'Nam':'Nữ',hho=pick(HO);
  person(hho,hg,ha,'Chủ hộ',fam);
  let fatherHo=hg==='Nam'?hho:null;
  if(ha<74||rnd()<.45){if(rnd()<.86){const sg=hg==='Nam'?'Nữ':'Nam';const sho=pick(HO);person(sho,sg,Math.max(20,ha+ri(-6,3)),hg==='Nam'?'Vợ':'Chồng',fam);if(sg==='Nam')fatherHo=sho}}
  const ch=ha<31?ri(0,2):ha<72?ri(0,3):0;
  for(let c=0;c<ch;c++){const ca=ha-ri(23,36);if(ca<0)continue;person(fatherHo||hho,rnd()<.5?'Nam':'Nữ',ca,'Con',fam)}
}
// Trẻ dâng con năm 2026
const youngFam=families.filter(f=>{const h=members.find(m=>m.id===f.members[0]);return h.age>=25&&h.age<=38});
const DED_DATES=[D(2026,1,11),D(2026,3,8),D(2026,5,10),D(2026,6,14),D(2026,8,9),D(2026,10,11)];
DED_DATES.forEach((dd,i)=>{const f=youngFam[i*2%youngFam.length];const h=members.find(m=>m.id===f.members[0]);const sp=f.members.map(id=>members.find(m=>m.id===id)).find(m=>m.role!=='Con'&&m.g==='Nam');
  const k=person((sp||h).ho,rnd()<.5?'Nam':'Nữ',0,'Con',f,{active:'Đang sinh hoạt'});k.dob=addD(dd,-ri(40,120));k.age=0;k.dedication=dd;k.status='Thiếu nhi';k.bans=[];});
// Báp-têm năm 2026
const BAP_DATES=[D(2026,4,5),D(2026,5,24),D(2026,9,13)];
const bapCand=members.filter(m=>m.status==='Thành viên'&&m.age>=13&&m.age<=45&&m.active==='Đang sinh hoạt');
const bap2026=[];for(let i=0;i<14;i++){const m=bapCand[(i*7+3)%bapCand.length];if(bap2026.includes(m))continue;m.baptism=BAP_DATES[i<6?0:i<10?1:2];bap2026.push(m)}
// Lớp dự bị Báp-têm
const catechumens=members.filter(m=>m.status==='Dự bị'&&m.age>=13&&m.active!=='Chuyển đi').slice(0,11);
// Ban Chấp sự
const deaconPool=members.filter(m=>m.status==='Thành viên'&&m.age>=35&&m.age<=66&&m.active==='Đang sinh hoạt');
const DEACON_ROLES=['Thư ký','Thủ quỹ','Chấp sự','Chấp sự','Chấp sự','Chấp sự','Chấp sự'];
const deacons=[];for(let i=0;i<7;i++){const m=deaconPool[(i*11+5)%deaconPool.length];if(deacons.find(d=>d.m===m))continue;deacons.push({m,role:DEACON_ROLES[deacons.length]});m.bans.unshift('Ban Chấp sự')}
const SECRETARY=deacons[0].m,TREASURER=deacons[1].m;
GROUPS.forEach((g,i)=>{const c=members.filter(m=>m.group===g.id&&m.status==='Thành viên'&&m.age>=30&&m.age<65&&m.active==='Đang sinh hoạt');g.lead=c.length?c[i%c.length].name:''});
const PASTOR='MS. Trần Đình Phúc',PREACHER2='TĐ. Lê Thị Ngọc Hân';

const living=()=>members.filter(m=>m.active!=='Chuyển đi');
const byId=id=>members.find(m=>m.id===id);

// Thành hôn, An táng
const weddings=[
 {d:D(2026,2,28),a:'',b:'',note:'Cả hai là tín hữu HT Bình An'},
 {d:D(2026,6,20),a:'',b:'',note:'Cô dâu thuộc Hội Thánh khác (có thư giới thiệu)'},
 {d:D(2026,9,19),a:'',b:'',note:'Cả hai là tín hữu HT Bình An'},
 {d:D(2026,11,28),a:'',b:'',note:'Đã rao hôn phối 3 Chúa nhật · Sắp cử hành'}];

 ['Giăng 15:1-8','Ở trong Chúa và kết quả'],['Rô-ma 12:1-2','Của lễ sống'],['Gia-cơ 1:19-27','Nghe và làm theo Lời'],

function attChart(){
  const vals=SUNDAYS.map((s,i)=>attCount(i)),W=640,H=230,l=34,b=26,t=12,max=Math.ceil(Math.max(...vals)/50)*50;
  const bw=(W-l-8)/vals.length,y=v=>t+(H-t-b)*(1-v/max);
  let g='';for(let v=0;v<=max;v+=50)g+=`<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=vals.map((v,i)=>{const x=l+i*bw+bw*.18,w=bw*.64,comm=SUNDAYS[i].getDate()<=7;return `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="3" fill="${comm?'var(--gold)':'var(--primary)'}" opacity="${i===vals.length-1?1:.78}"/>${i===vals.length-1||comm?`<text x="${x+w/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${v}</text>`:''}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${fmtS(SUNDAYS[i])}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ hiện diện">${g}${bars}</svg>`;
}

function banProgram(b){
  if(!allBanNames().includes(b))b=state.progBan='Ban Thanh niên';
  let ms=living().filter(m=>m.bans.includes(b)&&m.age>=16);
  if(!ms.length)ms=living().filter(m=>m.bans.includes('Giáo viên Trường Chúa nhật'));
  const p=i=>ms.length?ms[(i*7+3)%ms.length].name:'(chưa phân công)';
  const s=schedule[(allBanNames().indexOf(b)+1)%schedule.length];
  return [['Hướng dẫn chương trình',p(1)],['Ca ngợi',p(2)+' và nhóm hát'],['Cầu nguyện mở đầu',p(3)],['Chia sẻ Lời Chúa',s.ref+' · “'+s.topic+'”'],['Thảo luận, sinh hoạt nhóm',p(4)],['Thông báo của ban',p(5)],['Cầu nguyện kết thúc',p(6)]];
}

const DX_PILL={'Chờ duyệt':'p-warn','Đã duyệt':'p-pri','Đã chi':'p-good','Từ chối':'p-bad'};
V.expense=()=>{

   <div class="card"><div class="locked">${ic('lock')}<div><b style="color:var(--fg)">Vai trò “${ROLES[state.role]}” chưa được cấp quyền đề xuất chi</b><br>Mục sư Quản nhiệm cấp quyền trong Cấu hình Hội Thánh, mục Đề xuất chi & phê duyệt.</div></div></div>`;
  const by=s=>proposals.filter(p=>p.st===s),sum=a=>a.reduce((s,p)=>s+p.amt,0);
  const mine=canMoney()||isApprover()?proposals:proposals.filter(p=>p.by===state.role);
  const props=[...cfg.proposers].filter(k=>k!==cfg.approver).map(k=>ROLES[k]);

  <div class="card"><div class="flow">
    <div class="step">Bước 1 · Đề xuất<b>${props.join(', ')||'Chưa cấp quyền cho vai trò nào'}</b></div><span class="arr">→</span>
    <div class="step">Bước 2 · Phê duyệt<b>${ROLES[cfg.approver]}</b></div><span class="arr">→</span>
    <div class="step">Bước 3 · Lập phiếu chi<b>Thủ quỹ</b></div><span class="arr">→</span>
    <div class="step">Bước 4 · Vào sổ thu chi<b>Tự động, hiện trên Dâng hiến & Quỹ</b></div>
  </div></div>
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">CHỜ DUYỆT</div><div class="big num" style="color:var(--warn)">${by('Chờ duyệt').length}</div><div class="foot num"><span>Tổng <b>${tr(sum(by('Chờ duyệt')))}</b></span></div></div>
    <div class="card kpi"><div class="lbl">ĐÃ DUYỆT, CHỜ CHI</div><div class="big num" style="color:var(--primary)">${by('Đã duyệt').length}</div><div class="foot num"><span>Tổng <b>${tr(sum(by('Đã duyệt')))}</b></span></div></div>
    <div class="card kpi"><div class="lbl">ĐÃ CHI</div><div class="big num" style="color:var(--good)">${by('Đã chi').length}</div><div class="foot num"><span>Tổng <b>${tr(sum(by('Đã chi')))}</b></span></div></div>
    <div class="card kpi"><div class="lbl">TỪ CHỐI</div><div class="big num" style="color:var(--bad)">${by('Từ chối').length}</div><div class="foot num"><span>Tổng <b>${tr(sum(by('Từ chối')))}</b></span></div></div>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Số</th><th>Ngày</th><th>Người đề xuất</th><th>Quỹ</th><th>Nội dung</th><th class="right">Số tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>
  ${mine.map(p=>`<tr><td class="num nm">${p.id}</td><td class="num">${fmt(p.d)}</td><td>${esc(ROLE_NAME[p.by]||'')}<div class="small muted">${ROLES[p.by]||''}</div></td><td>${esc(fundName(p.fund))}</td><td>${esc(p.desc)}</td><td class="right num nm">${money(p.amt)}</td>
    <td><span class="pill ${DX_PILL[p.st]}">${p.st}</span>${p.ad?`<div class="small muted num">${fmt(p.ad)}</div>`:''}</td><td>${act(p)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Chưa có đề xuất nào của bạn.</td></tr>'}
  </tbody></table></div>
  <div class="small muted">Đổi vai trò ở góc dưới thanh bên trái để thử: Trưởng ban lập đề xuất, Mục sư duyệt, Thủ quỹ lập phiếu chi.</div>`;
};
function openPropose(){
  layer.innerHTML=`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="Tạo đề xuất chi">
  <div style="display:flex;align-items:center;margin-bottom:14px"><h3 style="margin:0">Tạo đề xuất chi</h3><button class="x" data-close aria-label="Đóng">${ic('x')}</button></div>
  <form class="form" id="dxForm">
   <label>Chi từ quỹ<select class="select" id="dxFund">${FUNDS.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>
   <label>Số tiền (đồng)<input class="input" id="dxAmt" type="number" min="1000" step="1000" required value="2500000"></label>
   <label class="full">Nội dung chi<textarea class="input" id="dxDesc" required>Mua văn phòng phẩm cho Trường Chúa nhật quý IV</textarea></label>
   <div class="full small muted">Người đề xuất: <b style="color:var(--fg)">${esc(ROLE_NAME[state.role])}</b> (${ROLES[state.role]}) · Người phê duyệt: <b style="color:var(--fg)">${ROLES[cfg.approver]}</b></div>
   <div class="full" style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn" data-close>Hủy</button><button class="btn pri" type="submit">Gửi đề xuất</button></div>
  </form></div>`;
  document.getElementById('dxForm').addEventListener('submit',e=>{e.preventDefault();
    const amt=+document.getElementById('dxAmt').value,desc=document.getElementById('dxDesc').value.trim();
    if(!(amt>0)||!desc)return toast('Nhập số tiền và nội dung chi');
    const p={id:'DX-10'+pad(dxN++),d:TODAY,fund:document.getElementById('dxFund').value,amt,desc,by:state.role,st:isApprover()?'Đã duyệt':'Chờ duyệt'};
    if(isApprover())p.ad=TODAY;
    proposals.unshift(p);close();go('expense');toast(isApprover()?'Đã tạo và tự duyệt '+p.id:'Đã gửi '+p.id+' đến '+ROLES[cfg.approver]);});
}

     <div class="opts"><label class="opt"><input type="radio" name="fBanMode" value="auto" ${cfg.banMode==='auto'?'checked':''}> Tự động theo độ tuổi</label><label class="opt"><input type="radio" name="fBanMode" value="manual" ${cfg.banMode==='manual'?'checked':''}> Thủ công</label></div>
     <div id="banAuto" class="small muted" style="margin-top:8px"></div>
     <div id="banManual" class="opts" style="margin-top:8px" hidden>${allBanNames().filter(b=>b!=='Ban Chấp sự').map(b=>`<label class="opt"><input type="checkbox" name="fBan" value="${esc(b)}"> ${esc(b)}</label>`).join('')}</div></div>
   <label class="full" style="flex-direction:row;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="fConsent" required> Tín hữu đã đồng ý cho Hội Thánh lưu trữ thông tin cá nhân</label>
   <div class="full" style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn" data-close>Hủy</button><button class="btn pri" type="submit">${ic('plus')}Lưu hồ sơ</button></div>
  </form></div>`;
  const banMode=()=>document.querySelector('input[name=fBanMode]:checked').value;
  const upd=()=>{const md=banMode(),a=ageOf(new Date(document.getElementById('fDob').value||'1995-06-15')),bs=ageBansFor(a);
    document.getElementById('banManual').hidden=md!=='manual';const au=document.getElementById('banAuto');au.hidden=md!=='auto';
    au.textContent=(isNaN(a)?'':a+' tuổi → tự xếp vào: ')+(bs.join(', ')||'chưa đủ tuổi vào ban nào');
    if(md==='manual')document.querySelectorAll('input[name=fBan]').forEach(c=>{if(!c.dataset.touched)c.checked=bs.includes(c.value)})};
  document.querySelectorAll('input[name=fBanMode]').forEach(r=>r.addEventListener('change',upd));
  document.querySelectorAll('input[name=fBan]').forEach(c=>c.addEventListener('change',()=>c.dataset.touched='1'));
  document.getElementById('fDob').addEventListener('input',upd);upd();
  document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();
    const nm=document.getElementById('fName').value.trim().replace(/\s+/g,' ');if(!nm)return;
    const parts=nm.split(' ');const g=document.getElementById('fG').value;const dob=new Date(document.getElementById('fDob').value||'1995-06-15');
    let famId=document.getElementById('fFam').value,fam;
    if(famId==='new'){fam={id:'GĐ-'+String(families.length+1).padStart(3,'0'),group:document.getElementById('fGroup').value,members:[],since:2026};families.push(fam)}else fam=families.find(f=>f.id===famId);
    const m={id:'TH-'+String(mid++).padStart(4,'0'),ho:parts[0],dem:parts.slice(1,-1).join(' '),ten:parts[parts.length-1],name:nm,g,dob,age:ageOf(dob),role:famId==='new'?'Chủ hộ':'Thành viên GĐ',fam:fam.id,group:document.getElementById('fGroup').value,phone:document.getElementById('fPhone').value,status:document.getElementById('fStatus').value,active:'Đang sinh hoạt',att:SUNDAYS.map(()=>false),bans:[]};
    if(banMode()==='auto'){m.bans=ageBansFor(m.age);m.banMode='Tự động theo độ tuổi'}
    else{m.bans=[...document.querySelectorAll('input[name=fBan]:checked')].map(c=>c.value);m.banMode='Thủ công'}
    m.type=document.getElementById('fType').value;
    if(m.type==='Thân hữu'){m.status='Thân hữu';m.stage='Mới đến';m.firstVisit=TODAY;m.ref=document.getElementById('fRef').value.trim();m.carer=''}
    members.unshift(m);fam.members.push(m.id);close();state.view='members';Object.assign(state,{q:'',grp:'',st:'',ban:'',bap:'',bday:'',type:''});render();toast('Đã thêm '+nm+' · mã '+m.id);});
}
const CERT_TITLE={bap:'GIẤY CHỨNG NHẬN BÁP-TÊM',ded:'GIẤY CHỨNG NHẬN DÂNG CON',wed:'CHỨNG THƯ THÀNH HÔN',transfer:'THƯ GIỚI THIỆU',member:'GIẤY XÁC NHẬN TÍN HỮU',apply:'ĐƠN XIN CHỊU BÁP-TÊM',visit:'PHIẾU THĂM VIẾNG'};
function openCert(kind,id){
  if(kind==='report')return openReport();
  let pool=kind==='bap'?members.filter(m=>m.baptism):kind==='ded'?members.filter(m=>m.dedication):kind==='apply'?catechumens:kind==='visit'?visits.map(v=>v.m):living().filter(m=>m.age>=16);
  let sel=id!=null&&kind!=='wed'?byId(id):pool[0];
  const wi=kind==='wed'?(+id||0):0;
  const body=()=>{
    const m=sel;
    if(kind==='wed'){const w=weddings[wi];return `<div class="who">${esc(w.a)} &amp; ${esc(w.b)}</div><p>đã được kết hợp trong Lễ Thành hôn cử hành tại Hội Thánh Bình An ngày <b>${fmt(w.d)}</b>, sau khi đã rao hôn phối 3 Chúa nhật theo quy định.</p>`}
    if(kind==='bap')return `<p>Chứng nhận</p><div class="who">${esc(m.name)}</div><p>sinh ngày ${fmt(m.dob)}, đã tin nhận Chúa Cứu Thế Giê-xu và chịu Lễ Báp-têm ngày <b>${fmt(m.baptism)}</b> tại Hội Thánh Bình An.</p><p class="small muted">Ma-thi-ơ 28:19</p>`;
    if(kind==='ded'){const ps=families.find(f=>f.id===m.fam).members.map(byId).filter(x=>x.role!=='Con');return `<p>Chứng nhận em</p><div class="who">${esc(m.name)}</div><p>sinh ngày ${fmt(m.dob)}, con của ${ps.map(p=>esc(p.name)).join(' và ')}, đã được cha mẹ dâng lên Chúa trong giờ thờ phượng ngày <b>${fmt(m.dedication)}</b>.</p>`}
    if(kind==='transfer')return `<p>Kính gửi Ban Chấp sự Hội Thánh nơi tín hữu chuyển đến,</p><p>Hội Thánh Bình An trân trọng giới thiệu</p><div class="who">${esc(m.name)}</div><p>tín hữu ${m.baptism?'đã chịu Báp-têm ngày '+fmt(m.baptism):'của Hội Thánh'}, có đời sống đức tin tốt, nay chuyển sinh hoạt về quý Hội Thánh. Xin quý Hội Thánh tiếp nhận và chăm sóc.</p>`;
    if(kind==='member')return `<p>Hội Thánh Bình An xác nhận</p><div class="who">${esc(m.name)}</div><p>sinh ngày ${fmt(m.dob)}, là tín hữu đang sinh hoạt tại Hội Thánh${m.baptism?', đã chịu Báp-têm ngày '+fmt(m.baptism):''}.</p>`;
    if(kind==='apply')return `<p>Kính gửi Mục sư Quản nhiệm và Ban Chấp sự,</p><p>Tôi tên</p><div class="who">${esc(m.name)}</div><p>sinh ngày ${fmt(m.dob)}, thuộc ${gName(m.group)}, đã học lớp dự bị Báp-têm khóa 2/2026. Tôi xin được chịu Lễ Báp-têm ngày 13/12/2026.</p><p class="small muted">Lời làm chứng: ………………………………</p>`;
    return `<div class="who">${esc(m.name)}</div><p>${gName(m.group)} · ${m.phone||'chưa có số'} · Gia đình ${m.fam}</p><p>Ngày thăm: ……/……/2026 · Người thăm: ……………… · Nhu cầu cầu thay: ………………</p>`;
  };
  const draw=()=>{document.getElementById('certBody').innerHTML=`<div class="cert"><div class="org">HỘI THÁNH TIN LÀNH VIỆT NAM (MIỀN NAM)<br>HỘI THÁNH BÌNH AN · ĐỊA HẠT KHÁNH HÒA</div><h3>${CERT_TITLE[kind]}</h3>${body()}<div class="sig"><div>Thư ký<b>${esc(SECRETARY.name)}</b></div><div>Ngày ${fmt(TODAY)}<br>Mục sư Quản nhiệm<b>${PASTOR}</b></div></div></div>`};
  layer.innerHTML=`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="${CERT_TITLE[kind]}">
   <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0">Xem trước biểu mẫu</h3>
   ${kind==='wed'?'':`<select class="select" id="certPick" aria-label="Chọn tín hữu" style="max-width:280px">${pool.slice(0,60).map(m=>`<option value="${m.id}" ${m===sel?'selected':''}>${esc(m.name)} · ${m.id}</option>`).join('')}</select>`}
   <button class="x" data-close aria-label="Đóng">${ic('x')}</button></div>
   <div id="certBody"></div>
   <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px"><button class="btn" data-act="exp">Xuất Word</button><button class="btn pri" data-act="exp">Xuất PDF</button></div></div>`;
  draw();
  const pk=document.getElementById('certPick');if(pk)pk.addEventListener('change',()=>{sel=byId(pk.value);draw()});
}
function openReport(){
  const L=living();
  const rows=[['Tín hữu chính thức (đã Báp-têm)',L.filter(m=>m.status==='Thành viên').length],['Tín hữu dự bị',L.filter(m=>m.status==='Dự bị').length],['Thiếu nhi',L.filter(m=>m.status==='Thiếu nhi').length],['Thân hữu đang theo dõi',L.filter(m=>m.type==='Thân hữu').length],['Thân hữu tin Chúa trong năm',members.filter(m=>m.convertedAt&&m.convertedAt.getFullYear()===2026).length],['Số gia đình tín hữu',families.filter(f=>f.members.some(id=>byId(id).type==='Tín hữu')).length],
   ['Báp-têm trong năm',bap2026.length],['Dâng con trong năm',members.filter(m=>m.dedication&&m.dedication.getFullYear()===2026).length],['Thành hôn trong năm',weddings.filter(w=>w.d<=TODAY).length],['An táng trong năm',funerals.length],
   ['Hiện diện thờ phượng bình quân (4 CN)',Math.round([8,9,10,11].reduce((s,i)=>s+attCount(i),0)/4)],['Số '+Ul(),GROUPS.length],['Chuyển đi trong năm',members.filter(m=>m.active==='Chuyển đi').length]];
  layer.innerHTML=`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="Báo cáo Tổng Liên Hội">

   <p class="small muted" style="margin-top:0">Kỳ báo cáo 01/01–21/10/2026 · tự tổng hợp từ sổ tín hữu và sổ lễ nghi · mẫu biểu cần đối chiếu với quy định của Tổng Liên Hội</p>
   <div class="tbl-wrap"><table style="min-width:420px"><thead><tr><th>Chỉ tiêu</th><th class="right">Số liệu</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="right num nm">${nf(r[1])}</td></tr>`).join('')}</tbody></table></div>
   <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px"><button class="btn" data-act="exp">Xuất Excel</button><button class="btn pri" data-act="exp">Xuất PDF</button></div></div>`;
}
let tt;function toast(msg){clearTimeout(tt);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;el.hidden=false;tt=setTimeout(()=>el.hidden=true,2600)}

/* ============ Render & sự kiện ============ */
const TITLES={overview:'Tổng quan',members:'Thuộc viên',families:'Gia đình',bans:'Ban ngành',attendance:'Điểm danh',rites:'Lễ nghi',worship:'Thờ phượng & Lịch giảng',care:'Chăm sóc & Cầu thay',giving:'Dâng hiến & Quỹ',expense:'Đề xuất chi & Phê duyệt',forms:'Biểu mẫu & Báo cáo',config:'Cấu hình Hội Thánh',roles:'Phân quyền'};
function render(keepFocus){
  renderSide();
  document.getElementById('pageTitle').textContent=state.view==='bans'?'Ban ngành & '+U():TITLES[state.view];
  const fid=keepFocus&&document.activeElement&&document.activeElement.id,pos=fid&&document.activeElement.selectionStart;
  document.getElementById('view').innerHTML=V[state.view]();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function go(v){state.view=v;state.limit=30;document.getElementById('side').classList.remove('open');try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-m],[data-close],[data-tab],[data-cert],[data-att],[data-visit],[data-ban]');if(!t)return;
  if(t.dataset.close!==undefined)return close();
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.tab){state.lnTab=t.dataset.tab;return render()}
  if(t.dataset.cert)return openCert(t.dataset.cert,t.dataset.id);
  if(t.dataset.ban){state.ban=t.dataset.ban;state.grp='';state.st='';state.q='';return go('members')}
  if(t.dataset.visit){const v=visits[+t.dataset.visit];v.done=true;v.last=TODAY;render();return toast('Đã ghi nhận thăm '+v.m.name)}
  if(t.dataset.att){const k=state.attSess+t.dataset.att;state.attOn.has(k)?state.attOn.delete(k):state.attOn.add(k);return render()}
  if(t.dataset.m){close();return openMember(t.dataset.m)}
  const a=t.dataset.act;
  if(a==='add')return openAdd();
  if(a==='report')return openReport();
  if(a==='more'){state.limit+=30;return render()}
  if(a==='attReset'){[...state.attOn].filter(k=>k.startsWith(state.attSess)).forEach(k=>state.attOn.delete(k));return render()}
  if(a==='scan'){const s=SESS[state.attSess];const rest=living().filter(m=>s.f(m)&&!state.attOn.has(state.attSess+m.id));if(!rest.length)return toast('Mọi người đã được điểm danh');
    const m=rest[Math.floor(Math.random()*rest.length)];state.attOn.add(state.attSess+m.id);state.attQ='';render();const el=document.getElementById('a-'+m.id);if(el){el.classList.add('flash');el.scrollIntoView({block:'nearest',behavior:'smooth'})}return toast('Bíp! Đã điểm danh '+m.name)}
  if(a==='lockAsk'){document.getElementById('lockArea').innerHTML=`<span class="small muted">Sau khi khóa, không sửa được phiếu tháng 10.</span> <button class="btn sm" data-act="lockNo">Hủy</button> <button class="btn sm pri" data-act="lockYes">Xác nhận khóa sổ</button>`;return}
  if(a==='lockNo')return render();
  if(a==='lockYes'){state.locked10=true;render();return toast('Đã khóa sổ tháng 10/2026')}
  if(a==='propose')return openPropose();
  if(a==='flt'){const k=t.dataset.k,v=t.dataset.v;state[k]=state[k]===v?'':v;state.limit=30;return render()}
  if(a==='seg'){state.type=t.dataset.v;state.limit=30;return render()}
  if(a==='clr'){Object.assign(state,{q:'',grp:'',st:'',ban:'',bap:'',bday:'',type:''});state.limit=30;return render()}
  if(a==='goFlt'){Object.assign(state,{q:'',grp:'',st:'',ban:'',bap:'',bday:'',type:''});state[t.dataset.k]=t.dataset.v;return go('members')}
  if(a==='stage'){const m=byId(t.dataset.id);m.stage=t.dataset.v;render();openMember(m.id);return toast(m.name+': '+m.stage)}
  if(a==='convert'){const m=byId(t.dataset.id);m.type='Tín hữu';m.status='Dự bị';m.convertedAt=TODAY;m.stage=null;if(!catechumens.includes(m))catechumens.push(m);render();openMember(m.id);return toast('Đã chuyển '+m.name+' thành tín hữu, ghi vào lớp dự bị Báp-têm')}
  const dxp=t.dataset.id&&proposals.find(p=>p.id===t.dataset.id);
  if(a==='dxOk'&&dxp){dxp.st='Đã duyệt';dxp.ad=TODAY;render();return toast('Đã duyệt '+dxp.id+'. Thủ quỹ sẽ lập phiếu chi.')}
  if(a==='dxNo'&&dxp){dxp.st='Từ chối';dxp.ad=TODAY;dxp.note='Không duyệt';render();return toast('Đã từ chối '+dxp.id)}
  if(a==='dxPay'&&dxp){if(state.locked10)return toast('Tháng 10 đã khóa sổ. Phiếu chi này sẽ ghi vào tháng 11.');
    const code='PC-10'+pad(pcN++);OCT_TX.unshift({d:TODAY,code,fund:dxp.fund,type:'Chi',desc:dxp.desc,amt:dxp.amt,by:TREASURER.name,dx:dxp.id});
    dxp.st='Đã chi';dxp.pc=code;render();return toast('Đã lập '+code+' và ghi vào sổ thu chi tháng 10')}
  if(a==='svcAdd'){const v=document.getElementById('svcNew').value.trim().replace(/\s+/g,' ');if(!v)return toast('Nhập tên ban phục vụ');
    if(allBanNames().includes(v))return toast('Ban “'+v+'” đã có');cfg.serviceBans.push(v);render();return toast('Đã thêm '+v)}
  if(a==='svcDel'){const b=cfg.serviceBans[+t.dataset.id];cfg.serviceBans.splice(+t.dataset.id,1);members.forEach(m=>m.bans=m.bans.filter(x=>x!==b));if(state.ban===b)state.ban='';render();return toast('Đã xóa '+b)}
  if(a==='fundAdd'){const v=document.getElementById('fundNew').value.trim().replace(/\s+/g,' ');if(!v)return toast('Nhập tên quỹ');
    FUNDS.push({id:'f'+(FUNDS.length+1)+'_'+Date.now()%10000,name:v,base:0});render();return toast('Đã thêm '+v)}
  if(a==='fundDel'){const i=FUNDS.findIndex(f=>f.id===t.dataset.id);if(i>=0){const n=FUNDS[i].name;FUNDS.splice(i,1);render();toast('Đã xóa '+n)}return}
  if(a==='exp')return toast('Bản demo chưa xuất file. Bản chính thức sẽ tải về Word, PDF hoặc Excel.');
  if(a==='ocr')return toast('Bản chính thức: chụp ảnh trang sổ, AI đọc chữ viết tay và điền vào bảng để Thư ký kiểm tra.');
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){state.q=e.target.value;state.limit=30;render(true)}
  if(id==='famQ'){state.famQ=e.target.value;render(true)}
  if(id==='attQ'){state.attQ=e.target.value;render(true)}

});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='fGrp'){state.grp=e.target.value;render()}
  if(id==='fSt'){state.st=e.target.value;render()}
  if(id==='fBan'){state.ban=e.target.value;render()}
  if(id==='fBap'){state.bap=e.target.value;state.limit=30;render()}
  if(id==='fBd'){state.bday=e.target.value;state.limit=30;render()}
  if(id==='attSess'){state.attSess=e.target.value;render()}

  if(e.target.name==='cfgBanMode'){cfg.banMode=e.target.value;render();return toast('Mặc định xếp ban: '+(cfg.banMode==='auto'?'Tự động':'Thủ công'))}
  if(id.startsWith('prop_')){const k=id.slice(5);e.target.checked?cfg.proposers.add(k):cfg.proposers.delete(k);return render()}
  if(id==='cfgApprover'){cfg.approver=e.target.value;render();return toast('Người phê duyệt: '+ROLES[cfg.approver])}
  if(id.startsWith('fundName_')){const f=FUNDS.find(x=>x.id===id.slice(9)),v=e.target.value.trim();if(f&&v){f.name=v;toast('Đã đổi tên quỹ')}render();return}
  if(id==='progBan'){state.progBan=e.target.value;return render()}
  if(id==='roleSel'){state.role=e.target.value;render();toast('Đang xem với vai trò: '+ROLES[state.role])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('side').classList.toggle('open'));
// Trạng thái mở sẵn cho bản demo điểm danh
living().filter(m=>m.age>=3).slice(0,0);
const h=(location.hash||'').slice(1);if(V[h])state.view=h;
render();
})();
